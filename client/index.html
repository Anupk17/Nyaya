<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nyaya — AI-powered autonomous dispute resolution for Paytm payment disputes" />
    <title>Nyaya — AI Dispute Resolution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var d = document.createElement('div');
        d.style.cssText = 'color:red; background:white; z-index:9999; position:absolute; top:0; left:0; width:100%; padding:20px;';
        d.innerText = 'ERROR: ' + msg + '\n' + (error && error.stack ? error.stack : '');
        document.body.appendChild(d);
        return false;
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
